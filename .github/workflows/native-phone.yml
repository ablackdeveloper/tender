name: Native phone E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/phone-integration/**"
      - ".github/workflows/native-phone.yml"
      - "apps/mobile/**"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TENDER_NATIVE_E2E: "1"
      TENDER_TEST_PASSWORD_SOURCE: disposable-generated
      MAESTRO_CLI_NO_ANALYTICS: "1"
      TENDER_ANDROID_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Cache build dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-native-dependencies-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install verified Maestro
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          echo '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  '"$RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/maestro/bin/maestro"
          echo "MAESTRO_BIN=$RUNNER_TEMP/maestro/bin/maestro" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated app and run native flows
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: pnpm test:flows:phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-phone-evidence-${{ matrix.shard }}
          path: scripts/feature-integration/artifacts/native-phone-runs/
          if-no-files-found: warn
          retention-days: 7
  android-complete:
    if: always()
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: native-phone-evidence-*
          path: android-evidence
      - name: Require all 30 native cases and all cleanup checks
        run: node scripts/phone-integration/verify-android-shards.mjs android-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-complete-evidence
          path: android-evidence/complete.json
          if-no-files-found: warn
          retention-days: 7
